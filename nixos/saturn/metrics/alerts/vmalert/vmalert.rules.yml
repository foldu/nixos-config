groups:
  - name: default
    rules:
      # only for servers (tagged type="server" via the server profile);
      # desktops/laptops reboot too often to be not obnoxious
      - alert: system-reboot
        expr: 'system_uptime{type="server"} != 0 and system_uptime{type="server"} < 300'
        for: "1m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}} just rebooted"
      # 90% for "normal" filesystems like ext4
      - alert: filesystem-full
        expr: 'disk_used_percent{mode!="ro",fstype!="btrfs",fstype!="efivarfs"} >= 90'
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}} device {{$labels.device}} on {{$labels.path}} got less than 10% space left on its filesystem"
      # 80% for zfs
      - alert: zfs-filesystem-full
        expr: 'disk_used_percent{mode!="ro",fstype="zfs"} >= 80'
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}} zfs device {{$labels.device}} on {{$labels.path}} got less than 20% space left on its filesystem"
      # 90% for btrfs
      - alert: btrfs-filesystem-full
        expr: "btrfs_usage_free_estimated / btrfs_usage_device_size < 0.10"
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}} btrfs on {{$labels.path}} has less than 10% free space left (used {{$value | humanize1024}}B)"
      - alert: filesystem-inodes-full
        expr: "disk_inodes_free / disk_inodes_total < 0.10"
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}} device {{$labels.device}} on {{$labels.path}} got less than 10% inodes left on its filesystem"
      - alert: swap-using-50percent
        expr: "swap_used_percent >= 50"
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}} is using 50% of its swap space for at least 10 minutes"
      - alert: systemd-service-failed
        # exclude user units and podman transient units (systemd-run healthchecks,
        # libpod scopes, machine-libpod pods) which fail routinely
        expr: 'systemd_units_active_code{name!~"user@\\d+\\.service|[0-9a-f]{64}-[0-9a-f]{16}\\.service|libpod-.*|machine-libpod_pod_.*"} == 3'
        # delay so units that briefly fail during boot/startup don't alert
        for: "2m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}} failed to (re)start service {{$labels.name}}"
      - alert: ram-using-95percent
        expr: "mem_buffered + mem_free + mem_cached < mem_total * 0.05"
        for: "1h"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}} is using at least 95% of its RAM for at least 1 hour"
      - alert: load15
        expr: "system_load15 / system_n_cpus >= 2.0"
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}} load15 is >= 2x its cpu count for at least 10 minutes: {{$value}}"
      - alert: telegraf-down
        expr: '(time() - tlast_over_time(system_uptime{type="server"}[24h])) > 180'
        for: "3m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}}: telegraf has not reported for {{$value}} seconds"

      # for-duration so brief blips (service restarts, slow startups like gitlab)
      # don't page; only sustained outages alert
      - alert: http
        expr: "http_response_result_code != 0"
        for: "5m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.server}} : http request failed from {{$labels.host}}: {{$labels.result}}"
      - alert: http-match-failed
        expr: "http_response_response_string_match == 0"
        for: "5m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.server}} : http body not as expected; status code: {{$labels.status_code}}"
      - alert: oom-kills
        expr: "increase(kernel_vmstat_oom_kill[5m]) > 0"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}}: OOM kill detected"
      - alert: uptime
        expr: "system_uptime > 2592000"
        for: "10m"
        labels:
          severity: info
        annotations:
          summary: "Uptime monster: {{$labels.host}} has been up for more than 30 days"
      - alert: ext4-errors
        expr: "ext4_errors_value > 0"
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}}: ext4 has reported {{$value}} I/O errors: check /sys/fs/ext4/*/errors_count"
      #  needs extra telegraf input
      - alert: zpool-status
        expr: "zpool_status_errors > 0"
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}} reports: zpool {{$labels.name}} has {{$value}} errors"
      - alert: zpool-degraded
        expr: "zpool_status_healthy == 0"
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}} reports: zpool {{$labels.name}} is not ONLINE"
      - alert: zfs-errors
        expr: "zfs_arcstats_l2_io_error + zfs_dmu_tx_error + zfs_arcstats_l2_writes_error > 0"
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}} reports: {{$value}} ZFS IO errors"
      - alert: smart-errors
        # dedupe by physical disk: power state (ACTIVE/IDLE_A/...) would
        # otherwise create one series per state
        expr: 'min by (host, model, serial_no, wwn) (smart_device_health_ok{enabled!="Disabled"}) != 1'
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}}: S.M.A.R.T reports: {{$labels.model}} ({{$labels.serial_no}}) has errors"
      - alert: smart-reallocated-sectors
        # power state (ACTIVE/IDLE_A/...) is part of the series labels, so a
        # drive changing power state would otherwise alert once per state;
        # aggregate away power and alert per physical disk
        expr: 'max by (host, model, serial_no, wwn) (smart_device_reallocated_sectors_count) > 0'
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}}: {{$labels.model}} ({{$labels.serial_no}}) has {{$value}} reallocated sectors"
      # nvme over high temps have degraded perf
      - alert: smart-temperature
        expr: 'max by (host, model, serial_no, wwn) (smart_device_temp_c) > 60'
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}}: {{$labels.model}} ({{$labels.serial_no}}) temperature {{$value}}°C"
      # CPU temp over 85 is pretty sus
      - alert: cpu-temp-high
        expr: 'sensors_temp_input{chip=~"k10temp.*|coretemp.*"} > 85'
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}}: CPU temperature {{$value}}°C ({{$labels.chip}}/{{$labels.feature}}) above 85°C for 10m"
      # same for GPUs
      - alert: gpu-temp-high
        expr: 'sensors_temp_input{chip=~"amdgpu.*"} > 85'
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}}: GPU temperature {{$value}}°C ({{$labels.chip}}/{{$labels.feature}}) above 85°C for 10m"
      - alert: nvidia-gpu-temp-high
        expr: "nvidia_smi_temperature_gpu > 85"
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}}: NVIDIA GPU ({{$labels.name}}) temperature {{$value}}°C above 85°C for 10m"
      - alert: disk-busy
        expr: "rate(diskio_io_time[5m]) / 1000 > 0.9"
        for: "10m"
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.host}}: device {{$labels.device}} is >90% busy for at least 10 minutes"
